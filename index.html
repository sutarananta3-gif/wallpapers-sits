<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper App FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
text-align:center;
padding:15px;
background:#000;
}

.box{
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
align-items:center;
}

input,button{
width:90%;
max-width:300px;
padding:10px;
border:none;
border-radius:8px;
}

button{
background:#00c853;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:#1a1a1a;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.name{
text-align:center;
padding:5px;
}

.del{
width:100%;
background:red;
}
</style>
</head>

<body>

<header>🔥 Wallpaper FIX APP</header>

<div class="box">

<input id="name" placeholder="Wallpaper Name">

<input id="file" type="file" accept="image/*">

<button onclick="add()">➕ Add Wallpaper</button>

</div>

<div class="grid" id="grid"></div>

<script>
let data = [];

function add(){

let name = document.getElementById("name").value;
let file = document.getElementById("file").files[0];

if(!name || !file){
alert("Name aur Image dono chahiye");
return;
}

let reader = new FileReader();

reader.onload = function(e){

data.unshift({
name:name,
img:e.target.result
});

document.getElementById("name").value="";
document.getElementById("file").value="";

render();
};

reader.readAsDataURL(file);
}

function del(i){
data.splice(i,1);
render();
}

function render(){

let grid = document.getElementById("grid");
grid.innerHTML="";

data.forEach((d,i)=>{

grid.innerHTML += `
<div class="card">
<img src="${d.img}">
<div class="name">${d.name}</div>
<button class="del" onclick="del(${i})">Delete</button>
</div>
`;

});

}

render();
</script>

</body>
</html>
